# 안전장치·스크립트 시험을 세 OS 에서 자동으로 돌린다.
# 설치본은 main 을 따라가므로, 깨진 guard.sh 가 main 에 들어가면 조용히 통과·과잉차단이 된다 — PR 마다 막는다.
name: test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      PYTHONUTF8: "1" # Windows 콘솔 기본 인코딩으로 한국어 출력이 깨지지 않게
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # 시험은 push 하지 않는다 — 토큰을 .git/config 에 남기지 않는다
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # README 약속(macOS 기본 bash 3.2)을 확인한다 — 훅은 PATH 의 bash 를 부르므로 시험 bash 와 PATH 맨 앞을 모두 /bin/bash 로
      - name: macOS 는 기본 bash 3.2 로
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$RUNNER_TEMP/bash32"
          ln -sf /bin/bash "$RUNNER_TEMP/bash32/bash"
          echo "GUARD_BASH=/bin/bash" >> "$GITHUB_ENV"
          echo "GUARD_PATH_PREFIX=$RUNNER_TEMP/bash32" >> "$GITHUB_ENV"
      - name: 도구 판
        shell: bash
        run: |
          "${GUARD_BASH:-bash}" --version | head -1
          PATH="${GUARD_PATH_PREFIX:+$GUARD_PATH_PREFIX:}$PATH" bash --version | head -1 # run.sh 가 안에서 다시 부르는 bash
          command -v awk
          { awk --version 2>/dev/null || awk -W version 2>/dev/null || true; } | head -1 || true # awk 판(맥 BWK·gawk·mawk 가 갈린다). 안 되면 그냥 지나감
          git --version
          python --version
      - name: test_guard
        run: python tests/test_guard.py
      - name: test_scripts
        if: ${{ !cancelled() }} # test_guard 가 실패해도 이 시험 결과는 따로 본다
        run: python tests/test_scripts.py
