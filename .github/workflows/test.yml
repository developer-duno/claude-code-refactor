# 안전장치·스크립트 시험을 세 OS 에서 자동으로 돌린다.
# 설치본은 main 을 따라가므로, 깨진 guard.sh 가 main 에 들어가면 조용히 통과·과잉차단이 된다 — PR 마다 막는다.
name: test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # 검사 이름 = matrix.os — main 보호 규칙의 필수 검사가 이 이름(test (ubuntu-latest) 등)을 본다. 이름은 바꾸지 말고 판은 image 로 고른다
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.image }}
    timeout-minutes: 30
    continue-on-error: ${{ matrix.preview }} # 미리보기 칸은 실패해도 실행 전체를 실패로 만들지 않는다(필수 검사도 아님)
    strategy:
      fail-fast: false
      matrix:
        include:
          # 우분투는 판을 고정한다 — ubuntu-latest 가 다음 판으로 넘어가는 날 필수 검사가 갑자기 깨지지 않게(0.3.3)
          - { os: ubuntu-latest, image: ubuntu-24.04, preview: false }
          - { os: windows-latest, image: windows-latest, preview: false }
          - { os: macos-latest, image: macos-latest, preview: false }
          # 다음 우분투 판을 미리 돌려 본다 — 초록이 이어지면 위 고정을 이 판으로 올린다
          - { os: ubuntu-26.04 미리보기, image: ubuntu-26.04, preview: true }
    env:
      PYTHONUTF8: "1" # Windows 콘솔 기본 인코딩으로 한국어 출력이 깨지지 않게
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # 시험은 push 하지 않는다 — 토큰을 .git/config 에 남기지 않는다
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # README 약속(macOS 기본 bash 3.2)을 확인한다 — 훅은 PATH 의 bash 를 부르므로 시험 bash 와 PATH 맨 앞을 모두 /bin/bash 로
      - name: macOS 는 기본 bash 3.2 로
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$RUNNER_TEMP/bash32"
          ln -sf /bin/bash "$RUNNER_TEMP/bash32/bash"
          echo "GUARD_BASH=/bin/bash" >> "$GITHUB_ENV"
          echo "GUARD_PATH_PREFIX=$RUNNER_TEMP/bash32" >> "$GITHUB_ENV"
      - name: 도구 판
        shell: bash
        run: |
          "${GUARD_BASH:-bash}" --version | head -1
          PATH="${GUARD_PATH_PREFIX:+$GUARD_PATH_PREFIX:}$PATH" bash --version | head -1 # run.sh 가 안에서 다시 부르는 bash
          command -v awk
          { awk --version 2>/dev/null || awk -W version 2>/dev/null || true; } | head -1 || true # awk 판(맥 BWK·gawk·mawk 가 갈린다). 안 되면 그냥 지나감
          git --version
          python --version
      # 두 시험을 한 잡 안에서 동시에 돌린다(0.3.5 — Windows 잡이 판마다 길어져서. 두 시험은 각각 한 줄기라 러너 코어가 남는다).
      # 잡을 나누면 필수 검사 이름(test (…))이 바뀌므로 나누지 않는다. 각자 로그 파일로 받고, 둘 다 기다린 뒤 하나라도 실패면 실패
      # 단계 한도 27분 = 잡 한도(30분)보다 먼저 끊겨 뒤의 로그 단계가 돌 시간을 남긴다 · python -u = 로그 파일에 버퍼 없이 바로 쓴다
      - name: test_guard · test_scripts (동시에)
        shell: bash
        timeout-minutes: 27
        run: |
          python -u tests/test_guard.py > "$RUNNER_TEMP/test_guard.log" 2>&1 &
          pid_guard=$!
          python -u tests/test_scripts.py > "$RUNNER_TEMP/test_scripts.log" 2>&1 &
          pid_scripts=$!
          rc_guard=0; wait "$pid_guard" || rc_guard=$?
          rc_scripts=0; wait "$pid_scripts" || rc_scripts=$?
          echo "test_guard 종료 코드 $rc_guard · test_scripts 종료 코드 $rc_scripts (로그는 다음 단계)"
          [ "$rc_guard" -eq 0 ] && [ "$rc_scripts" -eq 0 ]
      # 앞 단계가 실패하거나 한도에 걸려 끊겨도 두 로그를 묶음으로 보여 주고, 맨 끝에 두 시험의 'N/N 통과' 줄을 한 번 더
      - name: 시험 로그
        if: always()
        shell: bash
        run: |
          for n in test_guard test_scripts; do
            echo "::group::$n"
            cat "$RUNNER_TEMP/$n.log" 2>/dev/null || echo "($n 로그 없음)"
            echo "::endgroup::"
          done
          for n in test_guard test_scripts; do
            echo "$n: $(grep -E '^[0-9]+/[0-9]+ 통과' "$RUNNER_TEMP/$n.log" 2>/dev/null | tail -1 || true)"
          done
