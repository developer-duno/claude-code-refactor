name: 기능 제안
description: refactor 플러그인에 있으면 좋을 기능을 제안해 주세요.
title: "[제안] "
labels: ["제안"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 어떤 문제·불편이 있나요?
      description: 지금 무엇이 불편한지, 어떤 상황에서 그런지 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안하는 방법
      description: 어떻게 바뀌면 좋을지 적어 주세요. 구체적일수록 좋습니다.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 대안 (선택)
      description: 다른 방법을 생각해 보셨다면 적어 주세요.
    validations:
      required: false
